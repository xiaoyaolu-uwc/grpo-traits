[project]
name = "grpo-traits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcusl", email = "marcus.lu.sg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
grpo-traits = "grpo_traits:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]
